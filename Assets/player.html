<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --panel: rgba(16,16,19,.94); --line: rgba(255,255,255,.09); --muted: #9a9aa3; --accent: #1d9bf0; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; user-select: none;
    font: 13px/1.35 "Segoe UI", system-ui, sans-serif; color: #fff; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000;
    opacity: 0; transition: opacity .12s; }
  video.on { opacity: 1; }

  /* ---- overlays ---- */
  .fade { opacity: 0; transition: opacity .35s; pointer-events: none; }
  .fade.show { opacity: 1; }
  /* Frosted "glass" for anything drawn over the video: tinted + blurred, so text reads on any frame
     while the video stays visible through it. */
  :root { --glass: rgba(14,14,18,.52); --glass-strong: rgba(14,14,18,.66); --glass-line: rgba(255,255,255,.09);
          --glass-blur: blur(14px) saturate(150%); }
  .glass { background: var(--glass); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-line); box-shadow: 0 6px 24px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.05); }

  #osd { position: absolute; left: 46px; top: 8px; width: max-content; max-width: min(520px, calc(100% - 56px));
    box-sizing: border-box; padding: 6px 11px 7px; border-radius: 11px; transform: translateY(-3px);
    transition: opacity .35s, transform .35s; }
  #osd.show { transform: none; }
  #osd .who { display: flex; align-items: baseline; gap: 6px; min-width: 0; font-size: 12.5px; line-height: 18px; }
  #osd .who b { font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #osd .who span { color: rgba(255,255,255,.62); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #osd .txt { margin-top: 3px; font-size: 13px; line-height: 1.42; color: rgba(255,255,255,.93); letter-spacing: .1px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  #osd .txt:empty { display: none; }

  #burger { position: absolute; left: 8px; top: 8px; width: 30px; height: 30px; border-radius: 9px; padding: 0;
    color: #fff; font-size: 15px; cursor: pointer; display: grid; place-items: center; }
  #burger.show { pointer-events: auto; }
  #burger:hover { background: var(--glass-strong); }
  #flash { position: absolute; left: 50%; bottom: 20px; transform: translateX(-50%); max-width: 90%;
    padding: 5px 13px; border-radius: 999px; font-size: 12.5px; letter-spacing: .1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #bbb; pointer-events: none; white-space: pre-line; }
  #bar { position: absolute; left: 0; bottom: 0; height: 2px; width: 0; background: rgba(255,255,255,.75);
    pointer-events: none; }
  /* ---- scrub bar (sits above the 8px bottom resize edge) ---- */
  #scrub { position: absolute; left: 12px; right: 12px; bottom: 8px; height: 34px; display: none; cursor: pointer; }
  body.scrub #scrub { display: block; }
  body.scrub #bar { display: none; }
  body.scrub #flash { bottom: 50px; }
  #scrub.show, #scrub.drag { opacity: 1; pointer-events: auto; }
  #scrub .track { position: absolute; left: 0; right: 0; bottom: 8px; height: 4px; border-radius: 3px;
    background: rgba(255,255,255,.22); transition: height .1s; box-shadow: 0 0 6px rgba(0,0,0,.5); }
  #scrub:hover .track, #scrub.drag .track { height: 6px; }
  #scrub .buf, #scrub .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; }
  #scrub .buf { background: rgba(255,255,255,.3); }
  #scrub .fill { background: var(--accent); }
  #scrub .knob { position: absolute; top: 50%; left: 0; width: 13px; height: 13px; border-radius: 50%; background: #fff;
    transform: translate(-50%,-50%) scale(0); transition: transform .1s; box-shadow: 0 0 4px rgba(0,0,0,.6); }
  #scrub:hover .knob, #scrub.drag .knob { transform: translate(-50%,-50%) scale(1); }
  #scrub .times { position: absolute; left: 0; right: 0; bottom: 17px; display: flex; justify-content: space-between;
    font-size: 11px; font-variant-numeric: tabular-nums; pointer-events: none; }
  #scrub .times span { padding: 1px 7px; border-radius: 6px; background: var(--glass);
    -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur); }
  #scrub .tip { position: absolute; bottom: 21px; transform: translateX(-50%); padding: 2px 7px; border-radius: 6px;
    background: var(--glass-strong); -webkit-backdrop-filter: var(--glass-blur); backdrop-filter: var(--glass-blur);
    font-size: 11px; font-variant-numeric: tabular-nums; display: none; pointer-events: none; }
  #scrub:hover .tip, #scrub.drag .tip { display: block; }
  #pz { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 42px;
    color: rgba(255,255,255,.85); text-shadow: 0 0 12px #000; pointer-events: none; display: none; }
  #pz.show { display: block; }

  /* ---- fly-out menu ---- */
  #menu { position: absolute; left: 0; top: 0; bottom: 0; width: min(290px, 88vw); box-sizing: border-box;
    background: var(--panel); backdrop-filter: blur(12px); border-right: 1px solid var(--line);
    transform: translateX(-102%); transition: transform .18s ease-out; overflow-y: auto; overflow-x: hidden;
    padding: 10px 12px 14px; cursor: default; scrollbar-width: thin; }
  #menu.open { transform: none; box-shadow: 8px 0 30px rgba(0,0,0,.5); }
  #menu button { font: inherit; color: inherit; cursor: pointer; }
  .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .hd b { font-size: 14px; letter-spacing: .2px; }
  .brand { display: flex; align-items: center; gap: 7px; }
  .brand .logo { width: 20px; height: 20px; }
  .brand small { color: var(--muted); font-size: 11px; margin-left: 1px; }
  .x { background: none; border: 0; font-size: 18px !important; line-height: 1; padding: 2px 6px; color: var(--muted) !important; }
  .x:hover { color: #fff !important; }
  .sec { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--muted); }
  #tagbox { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 5px 6px; border-radius: 8px;
    border: 1px solid var(--line); background: rgba(255,255,255,.06); cursor: text; }
  #tagbox:focus-within { border-color: var(--accent); }
  #q { flex: 1; min-width: 90px; padding: 3px 4px; border: 0; background: none; color: #fff; font: inherit; outline: none; }
  .chip { display: inline-flex; align-items: center; gap: 2px; max-width: 100%; padding: 2px 2px 2px 8px; border-radius: 12px;
    background: rgba(29,155,240,.22); color: #cfe9fc; font-size: 12px; }
  .chip.neg { background: rgba(244,33,46,.2); color: #fbc4c8; }
  .chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip button { border: 0; background: none; padding: 0 5px; font-size: 14px !important; line-height: 1; opacity: .7; }
  .chip button:hover { opacity: 1; }
  .seg .gap { flex: .25; }
  .go { width: 100%; margin-top: 6px; background: var(--accent) !important; border-color: var(--accent) !important; font-weight: 600; }
  .go:hover { filter: brightness(1.1); }
  #recent { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; align-items: center; }
  #recent:empty { display: none; }
  #recent small { color: var(--muted); margin-right: 2px; }
  #recent button { border: 1px solid var(--line); background: none; border-radius: 12px; padding: 1px 8px; font-size: 12px !important; color: #ccc !important; }
  #recent button:hover { background: rgba(255,255,255,.1); color: #fff !important; }
  .seg { display: flex; gap: 4px; margin-top: 6px; }
  .seg button, .btn { flex: 1; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line);
    background: rgba(255,255,255,.04); }
  .seg button.on { background: var(--accent); border-color: var(--accent); }
  .btn:hover, .seg button:hover:not(.on), .feed:hover { background: rgba(255,255,255,.1); }
  #feeds { display: flex; flex-direction: column; gap: 2px; }
  .feed { text-align: left; padding: 7px 10px; border-radius: 7px; border: 0; background: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed.on { background: rgba(29,155,240,.18); color: #8ecdf8; font-weight: 600; }
  .link { background: none; border: 0; padding: 6px 10px; color: var(--muted) !important; text-align: left; }
  .link:hover { color: #fff !important; }
  #now { padding: 8px 10px; border-radius: 8px; background: rgba(255,255,255,.04); }
  #now .who { font-weight: 600; }
  #now .txt { color: #ccc; margin: 3px 0 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #now .none { color: var(--muted); }
  .transport { display: flex; gap: 6px; margin-top: 8px; }
  .transport button { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid var(--line);
    background: rgba(255,255,255,.05); font-size: 15px !important; }
  .transport button:hover { background: rgba(255,255,255,.12); }
  .slider { display: grid; grid-template-columns: 62px 1fr 34px; align-items: center; gap: 8px; margin: 6px 0; color: #ddd; }
  .slider span:last-child { color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .tg { display: flex; width: 100%; align-items: center; justify-content: space-between; padding: 6px 2px;
    background: none; border: 0; text-align: left; }
  .tg i { width: 30px; height: 17px; border-radius: 9px; background: #44444c; position: relative; transition: background .15s; flex: none; }
  .tg i::after { content: ""; position: absolute; left: 2px; top: 2px; width: 13px; height: 13px; border-radius: 50%;
    background: #fff; transition: transform .15s; }
  .tg.on i { background: var(--accent); }
  .tg.on i::after { transform: translateX(13px); }
  .tg small { color: var(--muted); margin-left: 6px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
  .hint { margin-top: 12px; color: var(--muted); font-size: 11px; line-height: 1.5; }
</style>
</head>
<body>
<video id="a" playsinline preload="auto"></video>
<video id="b" playsinline preload="auto"></video>
<div id="status"></div>
<div id="osd" class="fade glass"><div class="who"></div><div class="txt"></div></div>
<button id="burger" class="fade glass" title="Menu (S)">&#9776;</button>
<div id="pz">&#10074;&#10074;</div>
<div id="flash" class="fade glass"></div>
<div id="bar"></div>
<div id="scrub" class="fade">
  <div class="times"><span id="tcur">0:00</span><span id="tdur">0:00</span></div>
  <div class="tip"></div>
  <div class="track"><div class="buf"></div><div class="fill"></div><div class="knob"></div></div>
</div>

<aside id="menu">
  <div class="hd"><span class="brand"><svg class="logo" viewBox="0 0 256 256" aria-hidden="true"><defs><linearGradient id="lg" x1=".15" y1="0" x2=".85" y2="1"><stop offset="0" stop-color="#7cf2e4"/><stop offset=".55" stop-color="#8fa8ff"/><stop offset="1" stop-color="#b98cff"/></linearGradient><mask id="lm"><rect width="256" height="256" fill="#fff"/><path d="M110 92 L164 124 L110 156 Z" stroke="#000" stroke-width="10" stroke-linejoin="round"/></mask></defs><path mask="url(#lm)" fill="url(#lg)" d="M44 122C44 70 82 32 128 32s84 38 84 90v86c0 9-8 13-15 8l-19-13-20 15c-5 4-11 4-16 0l-14-12-14 12c-5 4-11 4-16 0l-20-15-19 13c-7 5-15 1-15-8z"/></svg><b>GhostFeed</b><small id="ver"></small></span><button class="x" data-close title="Close (Esc)">&times;</button></div>

  <form id="search">
    <div id="tagbox"><input id="q" placeholder="Add tags: word, #tag, @user, -exclude" autocomplete="off" spellcheck="false"></div>
    <div class="seg">
      <button type="button" data-match="any" class="on" title="Videos matching any tag">Any</button>
      <button type="button" data-match="all" title="Videos matching every tag">All</button>
      <span class="gap"></span>
      <button type="button" data-sort="top" class="on">Top</button>
      <button type="button" data-sort="latest">Latest</button>
    </div>
    <button type="submit" class="btn go">Search videos</button>
    <div id="recent"></div>
  </form>

  <div class="sec">Feeds</div>
  <div id="feeds"></div>
  <button class="link" data-msg="savePreset">+ Save current feed as preset</button>

  <div class="sec">Now playing</div>
  <div id="now"></div>
  <div class="transport">
    <button data-act="Prev" title="Previous">&#9198;</button>
    <button data-act="PlayPause" id="pp" title="Play / pause">&#9199;</button>
    <button data-act="Next" title="Next">&#9197;</button>
  </div>

  <div class="sec">Playback</div>
  <label class="slider"><span>Volume</span><input type="range" id="vol" min="0" max="100" step="1"><span id="volv"></span></label>
  <label class="slider"><span>Opacity</span><input type="range" id="opa" min="10" max="100" step="5"><span id="opav"></span></label>
  <button class="tg" data-tg="autoplay"><span>Autoplay<small>off = loop</small></span><i></i></button>
  <button class="tg" data-tg="muted"><span>Mute</span><i></i></button>
  <button class="tg" data-tg="scrubber"><span>Scrub bar<small>V</small></span><i></i></button>

  <div class="sec">Window</div>
  <button class="tg" data-tg="fullscreen"><span>Fullscreen<small>F · dbl-click</small></span><i></i></button>
  <button class="tg" data-tg="clickThrough"><span>Click-through<small id="cthk"></small></span><i></i></button>
  <button class="tg" data-tg="fit"><span>Fit window to video</span><i></i></button>
  <button class="tg" data-tg="topMost"><span>Always on top</span><i></i></button>
  <div class="grid2">
    <button class="btn" data-act="Browser">x.com browser</button>
    <button class="btn" data-act="Refresh">Refresh feed</button>
    <button class="btn" data-act="Hide">Hide</button>
    <button class="btn" data-act="Quit">Quit</button>
  </div>
  <div class="hint">Click video: play/pause · Double-click / F: fullscreen<br>Drag: move · Wheel: volume · Ctrl+wheel: opacity<br>S or / opens this menu · Esc closes</div>
</aside>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const post = m => window.chrome.webview.postMessage(m);
  const A = $('a'), B = $('b'), osd = $('osd'), flashEl = $('flash'), bar = $('bar'), pz = $('pz'),
        statusEl = $('status'), burger = $('burger'), menu = $('menu'), q = $('q');
  const scrub = $('scrub'), sTrack = scrub.querySelector('.track'), sFill = scrub.querySelector('.fill'),
        sBuf = scrub.querySelector('.buf'), sKnob = scrub.querySelector('.knob'), sTip = scrub.querySelector('.tip');
  let cur = A, nxt = B;
  const state = { volume: 0.8, muted: false, loop: false, scrub: true };
  let scrubbing = false, resumeAfterScrub = false;
  let ui = null, sort = 'top';
  let osdTimer = 0, flashTimer = 0, hasOsd = false;

  // ================================================================ playback
  const apply = v => { v.volume = state.volume; v.muted = state.muted; v.loop = state.loop; };

  function play(v) {
    const p = v.play();
    if (p) p.catch(err => {
      // Autoplay with sound blocked (shouldn't happen with the host's autoplay flag): fall back to muted.
      if (err && err.name === 'NotAllowedError' && !v.muted) { v.muted = true; v.play().catch(() => {}); }
    });
  }

  let upgrading = false, pendingPreload = null;
  function preload(url) {
    if (upgrading) { pendingPreload = url; return; } // spare element is busy with an upgrade
    if (!url || nxt.dataset.src === url) return;
    nxt.dataset.src = url;
    nxt.muted = true;
    nxt.src = url;
    nxt.load();
  }

  // Switch the playing clip to another rendition (e.g. higher quality for fullscreen) without restarting:
  // load it in the spare element, seek to the current position, then swap the two.
  let upgradeGen = 0;
  function upgrade(url) {
    if (!url || cur.dataset.src === url || !cur.dataset.src) return;
    const gen = ++upgradeGen, target = nxt, from = cur;
    upgrading = true;
    pendingPreload = null;
    const finish = ok => {
      if (gen !== upgradeGen) return;
      upgrading = false;
      const p = pendingPreload; pendingPreload = null;
      if (p) preload(p);
      post({ type: ok ? 'upgraded' : 'upgradeFailed' });
    };
    const onErr = () => {
      target.removeEventListener('error', onErr);
      if (target.dataset.src === url) delete target.dataset.src;
      finish(false);
    };
    target.addEventListener('error', onErr);
    target.pause();
    target.classList.remove('on');
    target.dataset.src = url;
    target.muted = true;
    target.loop = false;
    target.src = url;
    target.load();
    const stale = () => gen !== upgradeGen || cur !== from || target.dataset.src !== url;
    target.addEventListener('loadedmetadata', function onMeta() {
      target.removeEventListener('loadedmetadata', onMeta);
      if (stale()) return;
      target.addEventListener('seeked', function onSeeked() {
        target.removeEventListener('seeked', onSeeked);
        if (stale()) return;
        target.removeEventListener('error', onErr);
        const wasPaused = from.paused;
        // Fine-tune to where the old clip is now, then swap.
        if (!wasPaused && Math.abs(target.currentTime - from.currentTime) > 0.25) target.currentTime = from.currentTime;
        cur = target; nxt = from;
        cur.poster = from.poster;
        apply(cur);
        cur.classList.add('on');
        from.classList.remove('on');
        from.pause();
        if (!wasPaused) play(cur);
        paintProgress();
        finish(true);
      });
      target.currentTime = from.currentTime + (from.paused ? 0 : 0.35); // small lead for decode latency
    });
  }

  function load(m) {
    upgradeGen++; // cancel any in-flight upgrade
    upgrading = false;
    pendingPreload = null;
    const it = m.item;
    if (nxt.dataset.src === it.url) { const t = cur; cur = nxt; nxt = t; }
    else if (cur.dataset.src !== it.url) { cur.dataset.src = it.url; cur.src = it.url; }
    nxt.pause();
    nxt.classList.remove('on');
    cur.poster = it.poster || '';
    apply(cur);
    try { cur.currentTime = 0; } catch {}
    cur.classList.add('on');
    paintProgress();
    statusEl.textContent = '';
    play(cur);
    preload(m.next);
    showOsd(m.osd, it.text);
  }

  function clearVideo() {
    for (const v of [A, B]) { v.pause(); v.removeAttribute('src'); delete v.dataset.src; v.load(); v.classList.remove('on'); }
    hasOsd = false;
    osd.classList.remove('show');
    pz.classList.remove('show');
    bar.style.width = '0';
  }

  for (const v of [A, B]) {
    v.addEventListener('ended', () => { if (v === cur) post({ type: 'ended' }); });
    v.addEventListener('error', () => {
      if (v === cur && v.dataset.src) post({ type: 'error', code: v.error ? v.error.code : 0 });
    });
    for (const ev of ['timeupdate', 'progress', 'durationchange', 'loadedmetadata'])
      v.addEventListener(ev, () => { if (v === cur && !scrubbing) paintProgress(); });
    v.addEventListener('play', () => {
      if (v !== cur || scrubbing) return;
      pz.classList.remove('show'); $('pp').innerHTML = '&#10074;&#10074;';
      post({ type: 'paused', value: false });
    });
    v.addEventListener('pause', () => {
      if (v !== cur || v.ended || scrubbing) return;
      pz.classList.add('show'); $('pp').innerHTML = '&#9654;';
      post({ type: 'paused', value: true });
    });
  }

  // ================================================================ overlays
  function showOsd(who, text) {
    if (who !== undefined) {
      // "@author · 3/27 · GIF" → bold author, muted details.
      const [author, ...rest] = (who || '').split(' · ');
      const whoEl = osd.querySelector('.who');
      whoEl.replaceChildren(el('b', '', author || ''), ...(rest.length ? [el('span', '', rest.join(' · '))] : []));
      osd.querySelector('.txt').textContent = (text || '').trim();
      hasOsd = true;
    }
    burger.classList.add('show');
    scrub.classList.add('show');
    if (hasOsd && !menu.classList.contains('open')) osd.classList.add('show');
    clearTimeout(osdTimer);
    osdTimer = setTimeout(() => {
      osd.classList.remove('show');
      burger.classList.remove('show');
      // Keep the scrub bar up while it's hovered, dragged, or the video is paused.
      if (!scrubbing && !scrub.matches(':hover') && !cur.paused) scrub.classList.remove('show');
    }, 3000);
  }

  // ================================================================ scrub bar
  const fmt = t => {
    if (!isFinite(t) || t < 0) t = 0;
    t = Math.floor(t);
    const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = String(t % 60).padStart(2, '0');
    return h ? `${h}:${String(m).padStart(2, '0')}:${s}` : `${m}:${s}`;
  };

  function paintProgress() {
    const d = cur.duration, t = cur.currentTime || 0;
    const pct = d ? Math.min(100, t / d * 100) : 0;
    bar.style.width = sFill.style.width = sKnob.style.left = pct + '%';
    let buffered = 0;
    try { if (d && cur.buffered.length) buffered = cur.buffered.end(cur.buffered.length - 1) / d * 100; } catch {}
    sBuf.style.width = Math.min(100, buffered) + '%';
    $('tcur').textContent = fmt(t);
    $('tdur').textContent = fmt(d);
  }

  const scrubFrac = e => {
    const r = sTrack.getBoundingClientRect();
    return Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  };

  function seekFrac(f) {
    if (!cur.duration) return;
    cur.currentTime = f * cur.duration;
    paintProgress();
  }

  // preventDefault on pointerdown also suppresses the mouse events that would start a window move / click-pause.
  scrub.addEventListener('pointerdown', e => {
    if (e.button !== 0 || !cur.duration) return;
    e.preventDefault();
    e.stopPropagation();
    scrubbing = true;
    resumeAfterScrub = !cur.paused;
    if (resumeAfterScrub) cur.pause();
    scrub.setPointerCapture(e.pointerId);
    scrub.classList.add('drag');
    seekFrac(scrubFrac(e));
  });
  scrub.addEventListener('pointermove', e => {
    const f = scrubFrac(e);
    sTip.style.left = (f * 100) + '%';
    sTip.textContent = fmt(f * (cur.duration || 0));
    if (scrubbing) seekFrac(f);
  });
  const endScrub = e => {
    if (!scrubbing) return;
    scrubbing = false;
    scrub.classList.remove('drag');
    try { scrub.releasePointerCapture(e.pointerId); } catch {}
    if (resumeAfterScrub) play(cur);
    showOsd();
  };
  scrub.addEventListener('pointerup', endScrub);
  scrub.addEventListener('pointercancel', endScrub);

  function flash(text) {
    flashEl.textContent = text;
    flashEl.classList.add('show');
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => flashEl.classList.remove('show'), 1600);
  }

  // ================================================================ fly-out menu
  const isOpen = () => menu.classList.contains('open');

  function setMenu(open, focusSearch) {
    if (open === undefined || open === null) open = !isOpen();
    if (open === isOpen()) { if (open && focusSearch) q.focus(); return; }
    menu.classList.toggle('open', open);
    post({ type: 'menuState', open });
    if (open) {
      osd.classList.remove('show');
      render();
      loadSearchFromUi();
      if (focusSearch) setTimeout(() => q.focus(), 60);
    } else if (document.activeElement) {
      document.activeElement.blur();
    }
  }

  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function render() {
    if (!ui) return;
    const feeds = $('feeds');
    feeds.replaceChildren(...ui.sources.map(s => {
      const b = el('button', 'feed' + (s.url === ui.source ? ' on' : ''), s.name);
      b.title = s.url;
      b.onclick = () => { post({ type: 'source', url: s.url }); setMenu(false); };
      return b;
    }));
    if (!ui.sources.some(s => s.url === ui.source)) {
      const b = el('button', 'feed on', ui.sourceLabel || ui.source);
      b.title = ui.source;
      feeds.appendChild(b);
    }

    const now = $('now');
    if (ui.now) {
      const open = el('button', 'btn', 'Open on X ↗');
      open.dataset.act = 'OpenTweet';
      now.replaceChildren(el('div', 'who', `@${ui.now.author}  ·  ${ui.now.pos}`), el('div', 'txt', ui.now.text || ''), open);
    } else {
      now.replaceChildren(el('div', 'none', 'Nothing playing yet'));
    }

    $('vol').value = ui.volume; $('volv').textContent = ui.volume;
    $('opa').value = ui.opacity; $('opav').textContent = ui.opacity + '%';
    $('cthk').textContent = ui.clickThroughKey || '';
    $('ver').textContent = ui.version || '';
    for (const t of menu.querySelectorAll('[data-tg]')) t.classList.toggle('on', !!ui[t.dataset.tg]);
  }

  const TOGGLES = {
    autoplay: () => post({ type: 'act', act: 'Autoplay' }),
    muted: () => post({ type: 'act', act: 'Mute' }),
    clickThrough: () => post({ type: 'act', act: 'ClickThrough' }),
    fullscreen: () => post({ type: 'act', act: 'Fullscreen' }),
    scrubber: () => post({ type: 'act', act: 'Scrubber' }),
    fit: () => post({ type: 'set', key: 'fit', value: !ui.fit }),
    topMost: () => post({ type: 'set', key: 'topMost', value: !ui.topMost }),
  };

  menu.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.hasAttribute('data-close')) { setMenu(false); return; }
    if (t.dataset.sort) { setSeg('sort', t.dataset.sort); return; }
    if (t.dataset.match) { setSeg('match', t.dataset.match); return; }
    if (t.dataset.tg && ui) { TOGGLES[t.dataset.tg](); return; }
    if (t.dataset.msg) { post({ type: t.dataset.msg }); return; }
    if (t.dataset.act) {
      post({ type: 'act', act: t.dataset.act });
      if (['Browser', 'Hide', 'Quit', 'OpenTweet'].includes(t.dataset.act)) setMenu(false);
    }
  });

  // ---- tag search: chips in #tagbox; Enter/comma adds, Backspace on empty removes, Enter on empty searches
  let tags = [], match = 'any';
  const tagbox = $('tagbox');

  function setSeg(kind, value) {
    if (kind === 'sort') sort = value; else match = value;
    for (const b of menu.querySelectorAll(`[data-${kind}]`)) b.classList.toggle('on', b.dataset[kind] === value);
  }

  function addTags(text) {
    for (let t of text.split(',')) {
      t = t.trim().replace(/\s+/g, ' ');
      if (!t || t === '-' || t === '@') continue;
      if (!tags.some(x => x.toLowerCase() === t.toLowerCase())) tags.push(t);
    }
    renderTags();
  }

  function renderTags() {
    for (const c of tagbox.querySelectorAll('.chip')) c.remove();
    tags.forEach((t, i) => {
      const chip = el('span', 'chip' + (t.startsWith('-') ? ' neg' : ''));
      chip.title = t.startsWith('-') ? 'Excluded' : t.startsWith('@') ? 'From account' : 'Tag';
      const x = el('button', '', '×');
      x.type = 'button';
      x.title = 'Remove';
      x.onclick = e => { e.stopPropagation(); tags.splice(i, 1); renderTags(); q.focus(); };
      chip.append(el('span', '', t), x);
      tagbox.insertBefore(chip, q);
    });
    q.placeholder = tags.length ? 'Add another…' : 'Add tags: word, #tag, @user, -exclude';
    renderRecent();
  }

  function renderRecent() {
    const box = $('recent');
    const recent = ((ui && ui.recent) || []).filter(r => !tags.some(t => t.toLowerCase() === r.toLowerCase())).slice(0, 10);
    box.replaceChildren(...(recent.length ? [el('small', '', 'Recent')] : []), ...recent.map(r => {
      const b = el('button', '', r);
      b.type = 'button';
      b.onclick = () => { addTags(r); q.focus(); };
      return b;
    }));
  }

  function loadSearchFromUi() {
    if (!ui) return;
    tags = (ui.tags || []).slice();
    setSeg('match', ui.matchAll ? 'all' : 'any');
    setSeg('sort', ui.latest ? 'latest' : 'top');
    q.value = '';
    renderTags();
  }

  tagbox.addEventListener('mousedown', e => { if (e.target === tagbox) { e.preventDefault(); q.focus(); } });
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (q.value.trim()) { addTags(q.value); q.value = ''; }
      else if (tags.length) $('search').requestSubmit();
    } else if (e.key === ',') {
      e.preventDefault();
      if (q.value.trim()) { addTags(q.value); q.value = ''; }
    } else if (e.key === 'Backspace' && !q.value && tags.length) {
      e.preventDefault();
      tags.pop();
      renderTags();
    }
  });
  q.addEventListener('paste', e => {
    const text = (e.clipboardData || window.clipboardData).getData('text');
    if (text.includes(',')) { e.preventDefault(); addTags(text); }
  });

  $('search').addEventListener('submit', e => {
    e.preventDefault();
    if (q.value.trim()) { addTags(q.value); q.value = ''; }
    if (!tags.length) { q.focus(); return; }
    post({ type: 'search', tags, all: match === 'all', latest: sort === 'latest' });
    q.blur();
    setMenu(false);
  });

  $('vol').addEventListener('input', e => { $('volv').textContent = e.target.value; post({ type: 'set', key: 'volume', value: +e.target.value }); });
  $('opa').addEventListener('input', e => { $('opav').textContent = e.target.value + '%'; post({ type: 'set', key: 'opacity', value: +e.target.value }); });
  burger.addEventListener('click', () => setMenu(true));

  // ================================================================ host messages
  window.chrome.webview.addEventListener('message', e => {
    const m = e.data;
    switch (m.cmd) {
      case 'load': load(m); break;
      case 'preload': preload(m.url); break;
      case 'upgrade': upgrade(m.url); break;
      case 'toggle': if (cur.dataset.src) { cur.paused ? play(cur) : cur.pause(); } break;
      case 'play': if (cur.dataset.src) play(cur); break;
      case 'pause': cur.pause(); break;
      case 'seek':
        if (cur.duration) cur.currentTime = Math.max(0, Math.min(cur.duration - 0.1, cur.currentTime + m.delta));
        break;
      case 'state':
        Object.assign(state, m.state);
        apply(cur);
        document.body.classList.toggle('scrub', !!state.scrub);
        break;
      case 'ui': ui = m.state; if (isOpen()) render(); break;
      case 'menu': setMenu(m.open, m.focus); break;
      case 'flash': flash(m.text); break;
      case 'status':
        if (m.clear) clearVideo();
        statusEl.textContent = m.text || '';
        break;
    }
  });

  // ================================================================ mouse / keyboard on the video
  const EDGE = 8;
  const CURSORS = { 10: 'ew-resize', 11: 'ew-resize', 12: 'ns-resize', 15: 'ns-resize',
                    13: 'nwse-resize', 17: 'nwse-resize', 14: 'nesw-resize', 16: 'nesw-resize', 2: 'default' };
  const inUi = t => t && t.closest && t.closest('#menu, #burger, #scrub');

  function hitTest(x, y) {
    const w = innerWidth, h = innerHeight;
    const l = x < EDGE, r = x >= w - EDGE, t = y < EDGE, b = y >= h - EDGE;
    if (t && l) return 13; if (t && r) return 14; if (b && l) return 16; if (b && r) return 17;
    if (l) return 10; if (r) return 11; if (t) return 12; if (b) return 15;
    return 2; // HTCAPTION
  }

  // A press becomes a window move once the mouse travels a few pixels; otherwise it's a click.
  // Single click toggles play/pause (after a short wait so a double-click can cancel it).
  let down = null, clickTimer = 0;
  document.addEventListener('mousedown', e => {
    if (e.button !== 0 || inUi(e.target)) return;
    if (isOpen()) { setMenu(false); down = null; return; }
    const ht = hitTest(e.clientX, e.clientY);
    if (ht !== 2) { post({ type: 'drag', ht }); down = null; return; }
    down = { x: e.screenX, y: e.screenY };
  });
  document.addEventListener('mousemove', e => {
    if (down && (e.buttons & 1)) {
      if (Math.abs(e.screenX - down.x) + Math.abs(e.screenY - down.y) > 3) { post({ type: 'drag', ht: 2 }); down = null; }
      return;
    }
    if (inUi(e.target)) { document.body.style.cursor = ''; return; }
    document.body.style.cursor = CURSORS[hitTest(e.clientX, e.clientY)];
    showOsd();
  });
  document.addEventListener('mouseup', e => {
    if (e.button !== 0 || !down) return;
    down = null;
    if (clickTimer) { clearTimeout(clickTimer); clickTimer = 0; post({ type: 'dbl' }); return; }
    clickTimer = setTimeout(() => { clickTimer = 0; post({ type: 'act', act: 'PlayPause' }); }, 230);
  });
  document.addEventListener('contextmenu', e => {
    e.preventDefault();
    if (!inUi(e.target)) post({ type: 'menu' });
  });
  document.addEventListener('wheel', e => {
    if (inUi(e.target)) return; // let the menu scroll
    e.preventDefault();
    post({ type: 'wheel', dy: e.deltaY, ctrl: e.ctrlKey, shift: e.shiftKey });
  }, { passive: false });
  document.addEventListener('keydown', e => {
    if (e.ctrlKey && e.altKey) return; // global hotkeys
    const typing = e.target === q;
    if (e.key === 'Escape') {
      e.preventDefault();
      if (typing && q.value) q.value = '';
      else if (isOpen()) setMenu(false);
      else post({ type: 'key', key: 'Escape', shift: false, ctrl: false }); // host: leave fullscreen
      return;
    }
    if (typing) return;
    if (e.key === 's' || e.key === 'S' || e.key === '/') { e.preventDefault(); setMenu(true, true); return; }
    if (e.key === 'Tab') { e.preventDefault(); setMenu(); return; }
    if (isOpen() && (e.key === ' ' || e.key === 'Enter') && e.target.closest && e.target.closest('#menu button')) return; // activate focused button
    const repeatable = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key);
    if (e.repeat && !repeatable) return;
    e.preventDefault();
    post({ type: 'key', key: e.key, shift: e.shiftKey, ctrl: e.ctrlKey });
  });

  post({ type: 'ready' });
})();
</script>
</body>
</html>
